[tool.poetry]
name = "MOBI_QC"
version = "0.1.0"
description = "mobi qc"
authors = ["BryanGonzalez262 <bsg262@gmail.com>"]
license = "GNU Lesser General Public License v3.0"
readme = "README.md"
packages = [{include = "MOBI_QC", from = "src"}]

[tool.poetry.dependencies]
python = "~3.11"
pandas = "^2.3.3"
reportlab = "^4.4.4"
mne = "1.10.1"
certifi = "^2025.8.3"
cfgv = "^3.4.0"
chardet = "^5.2.0"
charset-normalizer = "^3.4.3"
contourpy = "^1.3.3"
coverage = "^7.10.7"
cycler = "^0.12.1"
decorator = "^5.2.1"
distlib = "^0.4.0"
filelock = "^3.19.1"
fonttools = "^4.60.1"
identify = "^2.6.15"
idna = "^3.10"
iniconfig = "^2.1.0"
jinja2 = "^3.1.6"
jsonpointer = "^3.0.0"
kiwisolver = "^1.4.9"
lazy-loader = "^0.4"
markupsafe = "^3.0.3"
matplotlib = "3.10.6"
munkres = "^1.1.4"
mypy = "^1.18.2"
mypy-extensions = "^1.1.0"
nodeenv = "^1.9.1"
numpy = "^2.3.3"
openmeeg = "^2.5.15"
packaging = "^25.0"
pdoc = "^15.0.4"
pillow = "^11.3.0"
platformdirs = "^4.4.0"
pluggy = "^1.5.0"
pooch = "^1.8.2"
pre-commit = "^4.3.0"
pygments = "^2.19.2"
pyparsing = "^3.2.5"
pyqt5 = "^5.15.11"
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
python-dateutil = "^2.9.0.post0"
pytz = "^2025.2"
pyyaml = "^6.0.3"
requests = "^2.32.5"
ruff = "^0.13.3"
scipy = "^1.16.2"
six = "^1.17.0"
tqdm = "^4.67.1"
typing-extensions = "^4.15.0"
tzdata = "^2025.2"
urllib3 = "^2.5.0"
virtualenv = "^20.34.0"
sounddevice = "^0.5.1"
pyprep = "^0.5.0"
neurokit2 = "^0.2.12"
seaborn = "^0.13.2"
pyxdf = "^1.17.0"
librosa = "^0.11.0"
opencv-python = "^4.11.0.86"
pywavelets = "^1.9.0"
python-picard = "^0.8"
mne-icalabel = "^0.8.0"
torch = "^2.8.0"
onnxruntime = "^1.23.0"
nbformat = "^5.10.4"
nbclient = "^0.10.2"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
mypy = "^1.18.2"
pre-commit = "^4.3.0"
pytest-cov = "^7.0.0"
ruff = "^0.13.3"
ipykernel = "^6.29.5"

[tool.poetry.group.docs.dependencies]
pdoc = "^15.0.4"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = [
  "tests"
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
indent-width = 4
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = []

[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"